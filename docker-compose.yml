services:
  mysql:
    profiles:
      - local-mysql
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DB:-sjw}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/create_test_schema.sql:/docker-entrypoint-initdb.d/01-create-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NO_PROXY: ${RUNTIME_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,mysql,qdrant}
      no_proxy: ${RUNTIME_NO_PROXY:-localhost,127.0.0.1,host.docker.internal,mysql,qdrant}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - ./data/app_state:/app/data/app_state
      - ./data/logs:/app/data/logs

volumes:
  mysql_data:
